name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install ansible-lint
      - name: Lint config/
        run: |
          if [ -n "$(find config -name '*.yml' -o -name '*.yaml' 2>/dev/null)" ]; then
            ansible-lint config/
          else
            echo "No Ansible content yet — skipping (see ROADMAP.md)."
          fi

  sigma-validate:
    name: Sigma rule validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sigma tooling
        run: pip install sigma-cli
      - name: Validate rules
        run: |
          if [ -n "$(find detections/sigma -name '*.yml' 2>/dev/null)" ]; then
            sigma check detections/sigma/
          else
            echo "No Sigma rules yet — skipping (see ROADMAP.md)."
          fi

  backend:
    name: Backend lint & test (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for backend project
        id: check
        run: echo "exists=$(test -f pyproject.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"
      - name: ruff
        if: steps.check.outputs.exists == 'true'
        run: ruff check .
      - name: mypy
        if: steps.check.outputs.exists == 'true'
        run: mypy .
      - name: pytest
        if: steps.check.outputs.exists == 'true'
        run: pytest
      - name: Skip (no backend yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No platform/backend project yet — skipping (see ROADMAP.md)."

  frontend:
    name: Frontend lint & test (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend project
        id: check
        run: echo "exists=$(test -f package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test
      - name: Skip (no frontend yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No platform/frontend project yet — skipping (see ROADMAP.md)."
