title: SYSVOL Planted-Credential Script Read
id: d20df036-b6c5-4c5a-87d1-d41c4c7abe59
status: test
description: >
  The specific SYSVOL script known to carry hardcoded plaintext
  credentials (map-network-drive.ps1) was read. Requires the filesystem
  SACL from
  telemetry/windows-audit-policy/configure-sysvol-file-sacl.ps1 — this is
  the only event source for "someone opened this file"; there is no
  directory-service equivalent. Detects attack/techniques.py's
  `sysvol_credential_read` technique, which exploits
  docs/vulnerabilities.md item 7.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: EADADL
date: 2026-08-01
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectName|endswith: 'map-network-drive.ps1'
  condition: selection
falsepositives:
  - Legitimate administrators reading the script to review or update it —
    rare in practice once item 7's real fix (removing the hardcoded
    credential entirely) ships; until then, any read is worth reviewing.
level: high
