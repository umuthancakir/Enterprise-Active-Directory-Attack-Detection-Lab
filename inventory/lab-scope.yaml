version: 1
lab:
  name: eadadl-lab
  deploy_target: local
  provisioned: true
hosts:
- id: dc01
  role: domain_controller
  hostname: dc01.eadadl.lab
  ip: null
  os: windows_server
  provisioned: false
  build_artifact: infra/local/build/images/dc01/dc01.qcow2
- id: mem01
  role: member_server
  hostname: mem01.eadadl.lab
  ip: null
  os: windows_server
  provisioned: false
  build_artifact: infra/local/build/images/mem01/mem01.qcow2
- id: attacker01
  role: attacker
  hostname: attacker01.eadadl.lab
  ip: null
  os: linux_kali
  provisioned: false
  build_artifact: infra/local/build/images/attacker01/attacker01.qcow2
  notes: 'The attacker box is the only host the engine invokes tooling FROM. It is
    never itself a valid --target for offensive techniques.

    '
- id: siem01
  role: siem
  hostname: siem01.eadadl.lab
  ip: 127.0.0.1
  os: linux_ubuntu
  provisioned: true
  build_artifact: infra/local/build/images/siem01/siem01.qcow2
  notes: 'Telemetry sink only. Never a valid --target for offensive techniques.

    '
  ssh_port: 2222
non_attackable_roles:
- attacker
- siem
