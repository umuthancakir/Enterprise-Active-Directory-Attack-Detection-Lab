# platform/docker-compose.yml
#
# The platform layer — FastAPI backend + Postgres + Next.js frontend.
# Runs OUTSIDE the lab network entirely (see README.md's architecture
# diagram) — distinct from telemetry/elastic/docker-compose.yml, which
# runs the SIEM stack ON siem01, inside the lab.
#
# STATUS: written, not run — no local Docker install (see ROADMAP.md
# "Known blockers"). platform/frontend/ in particular has not even had
# `npm install` run against it (no Node.js here either).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eadadl}
      POSTGRES_USER: ${POSTGRES_USER:-eadadl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eadadl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: platform/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eadadl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eadadl}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY must be set in .env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      BACKEND_ADMIN_USERNAME: ${BACKEND_ADMIN_USERNAME:-admin}
      BACKEND_ADMIN_PASSWORD: ${BACKEND_ADMIN_PASSWORD:?BACKEND_ADMIN_PASSWORD must be set in .env}
    volumes:
      # Read-only mounts so the container sees the real scope file +
      # coverage matrix without rebuilding the image every time either
      # changes — POST /runs and GET /coverage both read these live.
      - ../inventory:/app/inventory:ro
      - ../detections/coverage_matrix.json:/app/detections/coverage_matrix.json:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
