# infra/local/packer/http-linux/preseed.cfg
#
# Debian-installer preseed for attacker01 (Kali is Debian-derived and uses
# the same d-i preseed mechanism). Served by Packer's built-in HTTP server
# during kali-attacker.pkr.hcl's build — see that file's boot_command.
#
# STATUS: written but not build-tested — no local packer/qemu install to
# validate against (see BUILD_LOG.md). Kali's ARM64 installer preseed
# support specifically is less commonly documented than Debian/Ubuntu's; if
# this needs adjustment when actually run, start with Debian's own preseed
# reference (https://www.debian.org/releases/stable/amd64/apbs02.en.html)
# since Kali inherits d-i from Debian.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string attacker01
d-i netcfg/get_domain string eadadl.lab

d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali

d-i passwd/user-fullname string Lab Admin
d-i passwd/username string labadmin
# Placeholder only — SSH key auth is installed via late_command below and
# password auth is disabled afterward. This value is never meant to be
# used for real login.
d-i passwd/user-password-crypted password !
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo qemu-guest-agent curl

d-i grub-installer/only_debian boolean true
d-i finish-install/reboot_in_progress note

# BASE_URL is derived from the installer's own boot cmdline (the same
# url=http://{{ .HTTPIP }}:{{ .HTTPPort }}/preseed.cfg that boot_command in
# kali-attacker.pkr.hcl set) rather than hardcoded, since Packer's ephemeral
# HTTP server's port is only known at build time.
d-i preseed/late_command string \
    in-target sh -c "BASE_URL=$(sed 's#.*url=\\([^ ]*\\)/preseed.cfg.*#\\1#' /proc/cmdline); mkdir -p /home/labadmin/.ssh; wget -O /home/labadmin/.ssh/authorized_keys \"$BASE_URL/authorized_keys\"; chown -R labadmin:labadmin /home/labadmin/.ssh; chmod 700 /home/labadmin/.ssh; chmod 600 /home/labadmin/.ssh/authorized_keys; usermod -aG sudo labadmin; echo 'labadmin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/labadmin; sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config"
