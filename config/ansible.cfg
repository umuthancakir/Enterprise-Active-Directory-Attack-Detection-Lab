[defaults]
inventory = config/inventory/lab_scope_inventory.py
roles_path = config
host_key_checking = False
; Lab-only relaxation — see docs/adr/0005-local-network-isolation.md. Every
; host here is freshly built by infra/local for this run; there is no
; persistent host identity worth pinning across rebuilds like there would be
; for real infrastructure.
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30

[winrm]
; WinRM over HTTP (5985) with Basic auth — acceptable only because this
; traffic never leaves the isolated UTM host-only segment (ADR 0005).
; Do not reuse this connection config against anything routable.
