[project]
name = "eadadl"
version = "0.1.0"
description = "Enterprise Active Directory Attack & Detection Lab — shared Python tooling (attack engine, detections, scripts)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pysigma>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    # sigma-cli: optional, manual-use only (`sigma check`) — not used by
    # detections/test_runner.py itself, which deliberately avoids it since
    # its tag validator fetches MITRE ATT&CK data over the network. See
    # that module's docstring.
    "sigma-cli>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/local/build", "platform/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
# Only directories that actually contain .py files — mypy errors on an
# empty directory rather than skipping it. platform/backend/ will likely
# get its own pyproject.toml once Phase 5 lands (per CI's separate
# `backend` job) rather than being added here.
files = ["attack", "scripts", "config/inventory", "detections"]
exclude = ["attack/results", "attack/fixtures", "detections/fixtures"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
