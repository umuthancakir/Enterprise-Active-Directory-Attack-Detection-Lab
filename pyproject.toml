[project]
name = "eadadl"
version = "0.1.0"
description = "Enterprise Active Directory Attack & Detection Lab — shared Python tooling (attack engine, detections, scripts)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pysigma>=1.5.0",
    # detections/elastic_backend.py's pure Sigma->Lucene conversion — no
    # pipeline needed, see that module's docstring. Kept a core dependency
    # (not dev-only) since tests/test_elastic_backend.py exercises it in
    # the default test suite; only the *live-cluster* half
    # (detections/elastic_integration_check.py, needing the `elasticsearch`
    # client below) is dev/manual-use-only.
    "pysigma-backend-elasticsearch>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit include list — this repo has many top-level directories
# (infra/, telemetry/, config/, docs/, ...) that are NOT Python packages,
# and setuptools' flat-layout auto-discovery errors out ("multiple
# top-level packages discovered") without one. platform/backend/ installs
# this package as a path dependency (`pip install -e ../..`) specifically
# to import attack.runner/attack.lib.scope_guard — see
# platform/backend/README.md.
include = ["attack*", "detections*"]

[tool.setuptools.package-data]
# PEP 561 markers — lets platform/backend's mypy run (a separate
# pyproject.toml/package) resolve types for `import attack.X` as this
# package's own inline hints rather than reporting "Cannot find
# implementation or library stub."
attack = ["py.typed"]
detections = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    # sigma-cli: optional, manual-use only (`sigma check`) — not used by
    # detections/test_runner.py itself, which deliberately avoids it since
    # its tag validator fetches MITRE ATT&CK data over the network. See
    # that module's docstring.
    "sigma-cli>=1.0",
    # elasticsearch: official client, used only by
    # detections/elastic_integration_check.py — a manual/optional script
    # that needs a real reachable cluster, same "not part of the default
    # CI-run test suite" pattern as sigma-cli above. See that module's
    # docstring for why it's not wired into `make detections-test`.
    "elasticsearch>=8.15,<9",
    # pycdlib: used only by infra/local/generate_nocloud_iso.py, which
    # infra/local/build-linux.sh's siem01 path calls instead of Packer's
    # own (broken-on-macOS) cd_files/cd_label mechanism — see that
    # script's docstring for the full explanation. Operator/build
    # tooling, not exercised by any test.
    "pycdlib>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/local/build", "platform/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
# Only directories that actually contain .py files — mypy errors on an
# empty directory rather than skipping it. platform/backend/ will likely
# get its own pyproject.toml once Phase 5 lands (per CI's separate
# `backend` job) rather than being added here.
files = ["attack", "scripts", "config/inventory", "detections", "ir"]
exclude = ["attack/results", "attack/fixtures", "detections/fixtures"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
